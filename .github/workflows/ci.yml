name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The build must not contain a remote script or an env file
        run: |
          test -f extension/dist/manifest.json
          test -f extension/dist/service-worker.js
          test -f extension/dist/src/sidepanel/index.html
          ! grep -rIl "recaptcha/api.js\|recaptcha/enterprise.js" extension/dist
          ! find extension/dist -name ".env*" | grep .
