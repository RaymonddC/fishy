name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: The build must not contain a remote script or an env file
        run: |
          test -f extension/dist/manifest.json
          test -f extension/dist/service-worker.js
          test -f extension/dist/src/sidepanel/index.html
          ! grep -rIl "recaptcha/api.js\|recaptcha/enterprise.js" extension/dist
          ! find extension/dist -name ".env*" | grep .
      - name: The content scripts must not be able to reach the network
        run: |
          test -f extension/dist/content/meet-captions.js
          test -f extension/dist/content/gmail-open-email.js
          ! grep -E "fetch\(|XMLHttpRequest|WebSocket|sendBeacon|EventSource" extension/dist/content/meet-captions.js extension/dist/content/gmail-open-email.js
      - name: The Functions build and the approval page must be present
        run: |
          test -f functions/lib/index.js
          test -f web/approve/index.html
          node --check web/approve/main.js
          ! grep -rnE "https?://" web/approve/main.js web/approve/index.html
